# Zapasowe „budzenie” serwera na Render (serwer sam też się pinguje).
# Ustaw adres gry w: Settings → Secrets and variables → Actions → Variables → New variable
#   nazwa: APP_URL   wartość: https://twoja-gra.onrender.com
name: Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "Brak zmiennej APP_URL – pomijam."; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$APP_URL/health" && echo " – serwer działa"
